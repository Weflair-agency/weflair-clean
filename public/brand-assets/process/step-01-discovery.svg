<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf8"/>
      <stop offset="100%" stop-color="#f3f2ef"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" rx="12" fill="url(#bg1)"/>

  <!-- Vertical timeline line -->
  <line x1="42" y1="30" x2="42" y2="170" stroke="#22b84a" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Step dots on timeline -->
  <circle cx="42" cy="48" r="6" fill="#22b84a" fill-opacity=".12" stroke="#22b84a" stroke-opacity=".5" stroke-width="1.2"/>
  <circle cx="42" cy="48" r="2.5" fill="#22b84a"/>

  <circle cx="42" cy="98" r="6" fill="#22b84a" fill-opacity=".12" stroke="#22b84a" stroke-opacity=".5" stroke-width="1.2"/>
  <circle cx="42" cy="98" r="2.5" fill="#22b84a"/>

  <circle cx="42" cy="148" r="6" fill="#22b84a" fill-opacity=".12" stroke="#22b84a" stroke-opacity=".5" stroke-width="1.2"/>
  <circle cx="42" cy="148" r="2.5" fill="#22b84a"/>

  <!-- Row 1: Onboarding forms -->
  <rect x="60" y="34" width="156" height="28" rx="8" fill="#fff" stroke="#e5e5e3" stroke-width=".8"/>
  <rect x="72" y="43" width="10" height="10" rx="2.5" fill="#22b84a" fill-opacity=".1" stroke="#22b84a" stroke-opacity=".35" stroke-width=".8"/>
  <path d="M75 48l2 2 3-3" stroke="#22b84a" stroke-opacity=".7" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#2a2d32" fill-opacity=".78">Onboarding forms</text>

  <!-- Row 2: Account access -->
  <rect x="60" y="84" width="156" height="28" rx="8" fill="#fff" stroke="#e5e5e3" stroke-width=".8"/>
  <rect x="72" y="93" width="10" height="10" rx="2.5" fill="#22b84a" fill-opacity=".1" stroke="#22b84a" stroke-opacity=".35" stroke-width=".8"/>
  <path d="M75 98l2 2 3-3" stroke="#22b84a" stroke-opacity=".7" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#2a2d32" fill-opacity=".78">Account access</text>

  <!-- Row 3: Audit deck -->
  <rect x="60" y="134" width="156" height="28" rx="8" fill="#fff" stroke="#e5e5e3" stroke-width=".8"/>
  <rect x="72" y="143" width="10" height="10" rx="2.5" fill="#22b84a" fill-opacity=".1" stroke="#22b84a" stroke-opacity=".35" stroke-width=".8"/>
  <path d="M75 148l2 2 3-3" stroke="#22b84a" stroke-opacity=".7" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#2a2d32" fill-opacity=".78">Audit deck</text>

  <!-- Status badge top-right -->
  <rect x="224" y="34" width="42" height="20" rx="10" fill="#22b84a" fill-opacity=".08" stroke="#22b84a" stroke-opacity=".2" stroke-width=".8"/>
  <circle cx="234" cy="44" r="2.5" fill="#22b84a" fill-opacity=".6"/>
  <text x="241" y="48" font-family="system-ui,-apple-system,sans-serif" font-size="8" font-weight="700" fill="#22b84a" fill-opacity=".8" letter-spacing=".03em">3/3</text>

  <!-- Decorative mini badge -->
  <rect x="224" y="88" width="42" height="18" rx="9" fill="#f0f0ee" stroke="#e0dfdc" stroke-width=".7"/>
  <circle cx="234" cy="97" r="3.5" fill="#22b84a" fill-opacity=".12" stroke="#22b84a" stroke-opacity=".3" stroke-width=".7"/>
  <path d="M232.5 97l1 1 2.5-2.5" stroke="#22b84a" stroke-opacity=".6" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="241" y="100.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" font-weight="600" fill="#6b7280" letter-spacing=".03em">Done</text>
</svg>
