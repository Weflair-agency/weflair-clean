<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf8"/>
      <stop offset="100%" stop-color="#f3f2ef"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" rx="12" fill="url(#bg3)"/>

  <!-- Campaign card 1 -->
  <rect x="16" y="18" width="160" height="52" rx="8" fill="#fff" stroke="#e5e5e3" stroke-width=".8"/>
  <text x="28" y="38" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#2a2d32" fill-opacity=".82">Prospecting</text>

  <!-- LIVE badge -->
  <rect x="104" y="26" width="38" height="16" rx="8" fill="#22b84a" fill-opacity=".1" stroke="#22b84a" stroke-opacity=".25" stroke-width=".7"/>
  <circle cx="113" cy="34" r="2" fill="#22b84a">
    <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="119" y="37.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" font-weight="800" fill="#22b84a" fill-opacity=".8" letter-spacing=".05em">LIVE</text>

  <text x="28" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="8" font-weight="500" fill="#6b7280">8 Active Ads</text>
  <!-- Mini ad icons -->
  <rect x="92" y="46" width="12" height="12" rx="2.5" fill="#f0f0ee" stroke="#ddd" stroke-width=".6"/>
  <rect x="108" y="46" width="12" height="12" rx="2.5" fill="#f0f0ee" stroke="#ddd" stroke-width=".6"/>
  <rect x="124" y="46" width="22" height="12" rx="6" fill="#f0f0ee" stroke="#ddd" stroke-width=".6"/>
  <text x="131" y="55" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="600" fill="#6b7280">+5</text>

  <!-- Campaign card 2 -->
  <rect x="16" y="80" width="160" height="52" rx="8" fill="#fff" stroke="#e5e5e3" stroke-width=".8"/>
  <text x="28" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#2a2d32" fill-opacity=".82">Retargeting</text>

  <rect x="102" y="88" width="38" height="16" rx="8" fill="#22b84a" fill-opacity=".1" stroke="#22b84a" stroke-opacity=".25" stroke-width=".7"/>
  <circle cx="111" cy="96" r="2" fill="#22b84a">
    <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite" begin=".5s"/>
  </circle>
  <text x="117" y="99.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" font-weight="800" fill="#22b84a" fill-opacity=".8" letter-spacing=".05em">LIVE</text>

  <text x="28" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="8" font-weight="500" fill="#6b7280">4 Active Ads</text>
  <rect x="92" y="108" width="12" height="12" rx="2.5" fill="#f0f0ee" stroke="#ddd" stroke-width=".6"/>
  <rect x="108" y="108" width="22" height="12" rx="6" fill="#f0f0ee" stroke="#ddd" stroke-width=".6"/>
  <text x="115" y="117" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="600" fill="#6b7280">+2</text>

  <!-- Right side metric cards -->
  <rect x="190" y="18" width="72" height="46" rx="8" fill="#fff" stroke="#e5e5e3" stroke-width=".8"/>
  <text x="204" y="38" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" fill="#22b84a" fill-opacity=".7" letter-spacing="-.02em">2.4x</text>
  <text x="208" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="700" fill="#6b7280" letter-spacing=".04em">ROAS</text>

  <rect x="190" y="72" width="72" height="46" rx="8" fill="#fff" stroke="#e5e5e3" stroke-width=".8"/>
  <text x="202" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" fill="#22b84a" fill-opacity=".7" letter-spacing="-.02em">-31%</text>
  <text x="212" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="700" fill="#6b7280" letter-spacing=".04em">CAC</text>

  <!-- Bottom status bar -->
  <rect x="16" y="144" width="246" height="22" rx="6" fill="#fff" stroke="#e5e5e3" stroke-width=".7"/>
  <circle cx="30" cy="155" r="3" fill="#22b84a" fill-opacity=".5">
    <animate attributeName="opacity" values=".5;.15;.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="38" y="159" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="600" fill="#6b7280" letter-spacing=".02em">All campaigns tracked  &#xB7;  Conversions wired  &#xB7;  Attribution clean</text>
</svg>
