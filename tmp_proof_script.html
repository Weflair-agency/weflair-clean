    <script>
      (function () {
        var root = document.querySelector("[data-proof-switcher]");
        if (!root) return;

        var proofCases = [
          {
            type: "netpeak",
            logo: "/brand-assets/client-logos/farnell.png",
            alt: "Farnell logo",
            photo: "/brand-assets/cases/farnell.jpg",
            desc: "Embedded as part of Farnell\u2019s personalization squad alongside McKinsey. Built and deployed a continuous experimentation programme spanning product roadmap, UX, and commercial features \u2014 generating \u00A34.5m in incremental revenue.",
            metrics: [
              { value: "\u00A34.5m", label: "Incremental revenue" },
              { value: "+5%", label: "Conversion rate" },
              { value: "40%", label: "Experiment win rate" }
            ],
            services: ["CRO", "Personalization", "A/B Testing"],
            duration: "Ongoing",
            link: "/case-studies/farnell-personalization-squad.html"
          },
          {
            type: "heydigital",
            layout: "reversed",
            logo: "/brand-assets/client-logos/harrier-white.png",
            alt: "Harrier logo",
            headline: "8K subscribers at \u00A30.49 CPL. 5.53\u00D7 ROAS.",
            desc: "Full-funnel paid social from zero. Launched a three-stage Meta and Google strategy that captured new audiences, nurtured intent, and converted at scale \u2014 delivering 336 paying customers and \u00A3154K projected LTV.",
            visual: "ad-showcase",
            adFrames: [
              { body: "/brand-assets/cases/vip-vaping.jpg", brandName: "Harrier", headline: "Trail-tested. Race-ready.", cta: "harrier.co.uk", action: "Shop Now" },
              { body: "/brand-assets/cases/pink-boutique.jpg", brandName: "Harrier", headline: "New season drop \u2014 20% off", cta: "harrier.co.uk", action: "Shop Now" },
              { body: "/brand-assets/cases/molahin.jpg", brandName: "Harrier", headline: "Built for the trails you love", cta: "harrier.co.uk", action: "Learn More" },
              { body: "/brand-assets/cases/yours.jpg", brandName: "Harrier", headline: "Subscribe & save 15%", cta: "Newsletter signup", action: "Sign Up" },
              { body: "/brand-assets/cases/farnell.jpg", brandName: "Harrier", headline: "Your next PB starts here", cta: "harrier.co.uk", action: "Shop Now" },
              { body: "/brand-assets/cases/vip-vaping.jpg", brandName: "Harrier", headline: "Free UK delivery over \u00A375", cta: "harrier.co.uk", action: "Shop Now" }
            ],
            metrics: [
              { value: "8K", label: "New subscribers" },
              { value: "5.53\u00D7", label: "ROAS" },
              { value: "\u00A30.49", label: "CPL" },
              { value: "121%", label: "ROI" }
            ],
            link: "/case-studies/harrier-performance-rebuild.html"
          },
          {
            type: "netpeak",
            logo: "/brand-assets/client-logos/cellpoint-digital.png",
            alt: "CellPoint Digital logo",
            photo: "/brand-assets/cases/cellpoint-digital.jpg",
            desc: "Connected acquisition, TAM intelligence, buyer signals and playbooks into one GTM operating system for a $50M ARR payment orchestration platform\u2014turning scattered activity into a connected, repeatable commercial motion.",
            metrics: [
              { value: "\u20ac100M+", label: "Pipeline surfaced" },
              { value: "60x+", label: "Estimated ROI" },
              { value: "\u20ac24K+", label: "Ad waste removed" },
              { value: "3x", label: "Qualified traffic" }
            ],
            services: ["GTM Engineering", "SignalSphere", "Sales Playbooks", "Paid Acquisition"],
            duration: "9 months",
            link: "/case-studies/cellpoint-digital-revops.html"
          },
          {
            type: "heydigital",
            layout: "default",
            logo: "/brand-assets/client-logos/notcutts.svg",
            alt: "Notcutts logo",
            headline: "70% increase in conversion over 12 months.",
            desc: "Transformed a traditional garden centre retailer into a digital performer. Made 100% of in-store stock available online and rebuilt the UX from browsing to checkout \u2014 driving a 70% YoY conversion increase.",
            visual: "photo",
            photo: "",
            metrics: [
              { value: "+70%", label: "Conversion rate" },
              { value: "100%", label: "Stock online" }
            ],
            link: "/case-studies/notcutts-crm-conversion.html"
          },
          {
            type: "netpeak",
            logo: "/brand-assets/client-logos/travelsphere.svg",
            alt: "Travelsphere logo",
            photo: "",
            desc: "End-to-end digital reset for two heritage travel brands. Redesigned destination pages, rebuilt the conversion funnel, and unified analytics \u2014 resulting in sustained double-digit growth across all commercial KPIs.",
            metrics: [
              { value: "+25%", label: "YoY revenue" },
              { value: "+15%", label: "Conversion uplift" },
              { value: "+10%", label: "Lead growth" }
            ],
            services: ["Ecommerce", "UX", "CRO"],
            duration: "Ongoing",
            link: "/case-studies/travelsphere-digital-reset.html"
          }
        ];

        var activeIndex = 0;
        var prevButton = root.querySelector("[data-proof-nav-prev]");
        var nextButton = root.querySelector("[data-proof-nav-next]");
        var featureEl = root.querySelector(".weflair-proof-feature");

        // heydigital targets
        var logoTarget = root.querySelector("[data-proof-logo]");
        var headlineTarget = root.querySelector("[data-proof-headline]");
        var descTarget = root.querySelector("[data-proof-desc]");
        var photoTarget = root.querySelector("[data-proof-photo]");
        var adGridTarget = root.querySelector("[data-proof-ad-grid]");
        var metricsTarget = root.querySelector("[data-proof-metrics]");
        var linkTarget = root.querySelector("[data-proof-link]");

        // netpeak targets
        var npLogoTarget = root.querySelector("[data-proof-np-logo]");
        var npPhotoTarget = root.querySelector("[data-proof-np-photo]");
        var npDescTarget = root.querySelector("[data-proof-np-desc]");
        var npMetaTarget = root.querySelector("[data-proof-np-meta]");
        var npStatsTarget = root.querySelector("[data-proof-np-stats]");
        var npCtaTarget = root.querySelector("[data-proof-np-cta]");

        // shared
        var railsTarget = root.querySelector("[data-proof-rails]");
        var dotsTarget = root.querySelector("[data-proof-dots]");

        function logoHtml(item) {
          return '<img src="' + item.logo + '" alt="' + item.alt + '" loading="lazy" decoding="async">';
        }

        function metricHtml(metric) {
          return '<div class="weflair-proof-feature__metric"><strong>' + metric.value + '</strong><span>' + metric.label + '</span></div>';
        }

        function npStatHtml(metric) {
          return '<div class="weflair-proof-feature__np-stat"><strong>' + metric.value + '</strong><span>' + metric.label + '</span></div>';
        }

        function adFrameHtml(frame, item) {
          return '<div class="weflair-proof-feature__ad-frame">' +
            '<div class="weflair-proof-feature__ad-header">' +
              '<div class="weflair-proof-feature__ad-avatar"><img src="' + item.logo + '" alt=""></div>' +
              '<div><div class="weflair-proof-feature__ad-name">' + frame.brandName + '</div>' +
              '<div class="weflair-proof-feature__ad-sponsored">Sponsored</div></div>' +
            '</div>' +
            '<div class="weflair-proof-feature__ad-body" style="background-image:url(\'' + frame.body + '\')">' +
              (frame.headline ? '<div class="weflair-proof-feature__ad-body-headline">' + frame.headline + '</div>' : '') +
            '</div>' +
            '<div class="weflair-proof-feature__ad-footer">' +
              '<span class="weflair-proof-feature__ad-cta">' + frame.cta + '</span>' +
              '<span class="weflair-proof-feature__ad-action">' + (frame.action || 'Shop Now') + '</span>' +
            '</div>' +
          '</div>';
        }

        function studioSlideHtml(frame) {
          return '<div class="weflair-proof-studio__slide" style="background-image:url(\'' + frame.body + '\')">' +
            '<span>' + (frame.headline || frame.action || 'Campaign creative') + '</span>' +
          '</div>';
        }

        function studioLoopHtml(item) {
          return '<div class="weflair-proof-studio is-live-preview">' +
            '<iframe class="weflair-proof-studio__iframe" src="/handoff-cards/proof-design-loop.html" title="Creative preview loop" loading="lazy" scrolling="no"></iframe>' +
          '</div>';
        }

        function railHtml(item, index) {
          var label = item.alt.replace(" logo", "");
          return '<button type="button" class="weflair-proof-rail" data-proof-select="' + index + '" aria-label="Show ' + label + ' case study"><span class="weflair-proof-rail__logo">' + logoHtml(item) + '</span><span class="weflair-proof-rail__meta">' + label + '</span><span class="weflair-proof-rail__toggle" aria-hidden="true">+</span></button>';
        }

        function dotHtml(index) {
          return '<button type="button" class="weflair-proof-switcher__dot' + (index === activeIndex ? ' is-active' : '') + '" data-proof-dot="' + index + '" aria-label="Show case study ' + (index + 1) + '"></button>';
        }

        function nextIndexes(start) {
          var indexes = [];
          for (var offset = 1; offset <= 4; offset += 1) {
            indexes.push((start + offset) % proofCases.length);
          }
          return indexes;
        }

        function render() {
          var item = proofCases[activeIndex];

          // set card type
          featureEl.setAttribute("data-type", item.type);
          featureEl.setAttribute("data-layout", item.layout || "default");

          if (item.type === "heydigital") {
            // populate heydigital elements
            if (logoTarget) logoTarget.innerHTML = logoHtml(item);
            if (headlineTarget) headlineTarget.textContent = item.headline || "";
            if (descTarget) descTarget.textContent = item.desc;
            if (metricsTarget) metricsTarget.innerHTML = item.metrics.map(metricHtml).join("");
            if (linkTarget) linkTarget.setAttribute("href", item.link);

            // photo or ad-showcase
            if (item.visual === "photo" && photoTarget) {
              if (item.photo) {
                photoTarget.style.backgroundImage = 'url("' + item.photo + '")';
                photoTarget.classList.remove('no-photo');
              } else {
                photoTarget.style.backgroundImage = 'none';
                photoTarget.classList.add('no-photo');
              }
              photoTarget.style.backgroundPosition = item.photoPosition || "center center";
              photoTarget.parentElement.style.display = "";
              if (adGridTarget) {
                adGridTarget.style.display = "none";
                adGridTarget.innerHTML = "";
                adGridTarget.classList.remove("is-studio-loop");
              }
            } else if (item.visual === "ad-showcase" && adGridTarget && item.adFrames) {
              adGridTarget.innerHTML = studioLoopHtml(item);
              adGridTarget.classList.add("is-studio-loop");
              adGridTarget.style.display = "";
              if (photoTarget) photoTarget.parentElement.style.display = "none";
            }
          } else if (item.type === "netpeak") {
            // populate netpeak elements
            if (npLogoTarget) npLogoTarget.innerHTML = logoHtml(item);
            if (npPhotoTarget) {
              if (item.photo) {
                npPhotoTarget.style.backgroundImage = 'url("' + item.photo + '")';
                npPhotoTarget.classList.remove('no-photo');
              } else {
                npPhotoTarget.style.backgroundImage = 'none';
                npPhotoTarget.classList.add('no-photo');
              }
            }
            if (npDescTarget) npDescTarget.textContent = item.desc;
            if (npStatsTarget) npStatsTarget.innerHTML = item.metrics.map(npStatHtml).join("");
            if (npCtaTarget) npCtaTarget.setAttribute("href", item.link);

            // services + duration meta
            if (npMetaTarget) {
              var metaHtml = '';
              if (item.services) {
                metaHtml += '<div><div class="weflair-proof-feature__np-meta-label">Services delivered</div><div class="weflair-proof-feature__np-meta-value">' + item.services.join(', ') + '</div></div>';
              }
              if (item.duration) {
                metaHtml += '<div><div class="weflair-proof-feature__np-meta-label">Partnership duration</div><div class="weflair-proof-feature__np-meta-duration">' + item.duration + '</div></div>';
              }
              npMetaTarget.innerHTML = metaHtml;
            }
          }

          // rails
          if (railsTarget) {
            railsTarget.innerHTML = nextIndexes(activeIndex).map(function (index) {
              return railHtml(proofCases[index], index);
            }).join("");
          }

          // dots
          if (dotsTarget) {
            dotsTarget.innerHTML = proofCases.map(function (_, index) {
              return dotHtml(index);
            }).join("");
          }

          // bind rails
          Array.prototype.forEach.call(root.querySelectorAll("[data-proof-select]"), function (button) {
            button.addEventListener("click", function () {
              activeIndex = Number(button.getAttribute("data-proof-select"));
              render();
            });
          });

          // bind dots
          Array.prototype.forEach.call(root.querySelectorAll("[data-proof-dot]"), function (button) {
            button.addEventListener("click", function () {
              activeIndex = Number(button.getAttribute("data-proof-dot"));
              render();
            });
          });
        }

        prevButton.addEventListener("click", function () {
          activeIndex = (activeIndex - 1 + proofCases.length) % proofCases.length;
          render();
        });

        nextButton.addEventListener("click", function () {
          activeIndex = (activeIndex + 1) % proofCases.length;
          render();
        });

        render();
      })();
    </script>
